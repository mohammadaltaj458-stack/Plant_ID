<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Care Time</title>

  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >

  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
    rel="stylesheet"
  >

  <style>
    :root {
      --main-color: #136a03;
      --main-dark: #0d4f02;
      --soft-green: #eaf7e8;
      --light-bg: #f4f7f5;
      --danger-color: #dc3545;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(19, 106, 3, 0.18), transparent 35%),
        linear-gradient(135deg, #f8fff8, #edf4ef);
      padding: 25px;
    }

    .app-wrapper {
      width: 100%;
      min-height: calc(100vh - 50px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-card {
      width: 100%;
      max-width: 850px;
      border: none;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      background-color: white;
    }

    .hero {
      background: linear-gradient(135deg, var(--main-color), var(--main-dark));
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .brand-icon {
      width: 75px;
      height: 75px;
      border-radius: 24px;
      background-color: rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 18px;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .hero p {
      max-width: 560px;
      margin: auto;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.7;
    }

    .content-area {
      padding: 35px;
    }

    .section-title {
      font-weight: 800;
      color: #222;
      margin-bottom: 8px;
      text-align: center;
    }

    .section-subtitle {
      color: #777;
      margin-bottom: 25px;
      text-align: center;
    }

    .form-box {
      background-color: var(--light-bg);
      border-radius: 22px;
      padding: 25px;
      border: 1px solid #e2e8e3;
      margin-bottom: 25px;
    }

    .form-label {
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }

    .form-control {
      border-radius: 14px;
      padding: 13px 15px;
      border: 1px solid #cfd8d1;
      font-size: 15px;
    }

    .form-control:focus {
      border-color: var(--main-color);
      box-shadow: 0 0 0 0.2rem rgba(19, 106, 3, 0.15);
    }

    textarea {
      min-height: 130px;
      resize: none;
    }

    .btn-main {
      background-color: var(--main-color);
      border: none;
      color: white;
      border-radius: 14px;
      padding: 13px;
      font-weight: 700;
      transition: 0.3s;
    }

    .btn-main:hover {
      background-color: var(--main-dark);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(19, 106, 3, 0.25);
    }

    .alerts-box {
      background-color: #ffffff;
      border: 1px solid #e2e8e3;
      border-radius: 22px;
      padding: 22px;
    }

    .alerts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .alerts-header h3 {
      font-size: 23px;
      font-weight: 800;
      color: #222;
      margin: 0;
    }

    .badge-custom {
      background-color: var(--soft-green);
      color: var(--main-color);
      padding: 8px 14px;
      border-radius: 30px;
      font-weight: 700;
      white-space: nowrap;
    }

    .list {
      max-height: 430px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .alert-item {
      background: white;
      border: 1px solid #e1e6e2;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.045);
      transition: 0.25s;
    }

    .alert-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
    }

    .time-icon {
      min-width: 58px;
      height: 58px;
      border-radius: 18px;
      background-color: var(--soft-green);
      color: var(--main-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .alert-content {
      flex: 1;
      overflow: hidden;
    }

    .time {
      font-size: 17px;
      font-weight: 800;
      color: var(--main-color);
      margin-bottom: 4px;
    }

    .message {
      color: #555;
      line-height: 1.5;
      word-break: break-word;
    }

    .delete-btn {
      border: none;
      background-color: #fff1f2;
      color: var(--danger-color);
      width: 42px;
      height: 42px;
      border-radius: 13px;
      transition: 0.25s;
    }

    .delete-btn:hover {
      background-color: var(--danger-color);
      color: white;
    }

    .empty {
      height: 220px;
      border: 2px dashed #d5ded7;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .empty i {
      font-size: 42px;
      color: #a8b3aa;
      margin-bottom: 12px;
    }

    .empty p {
      color: #888;
      margin: 0;
      font-weight: 600;
    }

    .footer-note {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-top: 22px;
    }

    @media (max-width: 576px) {
      body {
        padding: 10px;
      }

      .main-card {
        border-radius: 20px;
      }

      .hero {
        padding: 30px 20px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .content-area {
        padding: 20px;
      }

      .alerts-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .alert-item {
        align-items: flex-start;
      }

      .delete-btn {
        min-width: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="index.html"> MyPlant <i class="bi bi-leaf-fill text-success"></i></a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html" data-translate="nav-home">Home</a></li>
          <li class="nav-item ms-3">
            <span class="nav-link" data-lang-toggle style="cursor: pointer;">
              <i class="bi bi-globe"></i> AR | EN
            </span>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="app-wrapper">
    <div class="main-card">

      <div class="hero">
        <div class="brand-icon">
          <i class="bi bi-bell-fill"></i>
        </div>

        <h1 data-translate="care-time-title">Care Time</h1>

        <p data-translate="care-time-desc">
            Never miss watering, sunlight, or plant care tasks again.
        </p>
      </div>

      <div class="content-area">

        <h2 class="section-title" data-translate="create-task">Create Care Task</h2>
        <p class="section-subtitle" data-translate="task-subtitle">
          Choose a time and write the plant care task you want to follow.
        </p>

        <div class="form-box">
          <div class="mb-3">
            <label for="alertTime" class="form-label">
              <i class="bi bi-clock me-1"></i>
              <span data-translate="care-time-label">Care Time</span>
            </label>
            <input type="time" class="form-control" id="alertTime" value="08:00">
          </div>

          <div class="mb-3">
            <label for="alertMessage" class="form-label">
              <i class="bi bi-chat-left-text me-1"></i>
              <span data-translate="task-description">Task Description</span>
            </label>
            <textarea
              class="form-control"
              id="alertMessage"
              data-translate="task-description"
              placeholder="Example: Water the mint plant, check sunlight, add fertilizer..."
            ></textarea>
          </div>

          <button class="btn btn-main w-100" onclick="addAlert()">
            <i class="bi bi-plus-circle me-1"></i>
            <span data-translate="add-task">Add Care Task</span>
          </button>
        </div>

        <div class="alerts-box">
          <div class="alerts-header">
            <h3 data-translate="active-tasks">Care Tasks</h3>
            <span class="badge-custom" id="alertsCount"> 0 Tasks</span>
          </div>

          <div class="list" id="alertsList"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Translations + Language Switcher -->
  <script src="translations.js"></script>
  <script src="language.js"></script>

  <script>
    var alerts = [];
    var triggeredAlerts = {};

    // ── Load reminders from backend ──
    window.addEventListener('DOMContentLoaded', loadReminders);

    async function loadReminders() {
      try {
        var resp = await fetch('http://localhost:3000/api/reminders', { credentials: 'include' });

        if (resp.status === 401) {
          document.getElementById('alertsList').innerHTML =
            "<div class='empty'>" +
              "<i class='bi bi-person-circle'></i>" +
              "<p data-translate='login-for-reminders'>Login to save and view reminders</p>" +
            "</div>";
          return;
        }

        var data = await resp.json();
        alerts = (data.reminders || []).map(function(r) {
          return { id: r.id, time: r.reminder_time, message: r.title };
        });
        renderAlerts();
        checkAlerts();
      } catch (e) {
        document.getElementById('alertsList').innerHTML =
          "<div class='empty'>" +
            "<i class='bi bi-exclamation-circle'></i>" +
            "<p>Error loading reminders</p>" +
          "</div>";
      }
    }

    // ── Add reminder ──
    async function addAlert() {
      var time = document.getElementById("alertTime").value;
      var message = document.getElementById("alertMessage").value.trim();

      if (time === "" || message === "") {
        window.alert("Please fill all fields");
        return;
      }

      try {
        var resp = await fetch('http://localhost:3000/api/reminders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ title: message, reminderTime: time })
        });

        if (resp.status === 401) {
          window.alert("Please login to save reminders");
          return;
        }

        if (!resp.ok) {
          window.alert("Failed to save reminder");
          return;
        }

        var data = await resp.json();
        var r = data.reminder;
        alerts.push({ id: r.id, time: r.reminder_time, message: r.title });
        renderAlerts();

        document.getElementById("alertMessage").value = "";
        window.alert("Alert added successfully");
      } catch (e) {
        window.alert("Connection error");
      }
    }

    // ── Render ──
    function renderAlerts() {
      var list = document.getElementById("alertsList");
      var count = document.getElementById("alertsCount");

      list.innerHTML = "";
      count.innerHTML = alerts.length + (alerts.length === 1 ? " Alert" : " Alerts");

      if (alerts.length === 0) {
        list.innerHTML =
          "<div class='empty'>" +
            "<i class='bi bi-bell-slash'></i>" +
            "<p data-translate='no-tasks'>No tasks yet. Create one to get started!</p>" +
          "</div>";
        return;
      }

      for (var i = 0; i < alerts.length; i++) {
        var div = document.createElement("div");
        div.className = "alert-item";

        div.innerHTML =
          "<div class='time-icon'>" +
            "<i class='bi bi-alarm'></i>" +
          "</div>" +

          "<div class='alert-content'>" +
            "<div class='time'>" + alerts[i].time + "</div>" +
            "<div class='message'>" + alerts[i].message + "</div>" +
          "</div>" +

          "<button class='delete-btn' onclick='deleteAlert(" + i + ")' title='Delete'>" +
            "<i class='bi bi-trash'></i>" +
          "</button>";

        list.appendChild(div);
      }
    }

    // ── Delete reminder ──
    async function deleteAlert(index) {
      var reminder = alerts[index];
      if (!reminder.id) {
        alerts.splice(index, 1);
        renderAlerts();
        return;
      }

      try {
        var resp = await fetch('http://localhost:3000/api/reminders/' + reminder.id, {
          method: 'DELETE',
          credentials: 'include'
        });

        if (resp.ok) {
          alerts.splice(index, 1);
          renderAlerts();
        } else {
          window.alert("Failed to delete reminder");
        }
      } catch (e) {
        window.alert("Connection error");
      }
    }

    // ── Sound notification ──
    function playSound() {
      try {
        var audioContext = new (window.AudioContext || window.webkitAudioContext)();
        var oscillator = audioContext.createOscillator();
        var gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.frequency.value = 800;
        gainNode.gain.value = 0.3;

        oscillator.start();

        setTimeout(function () {
          oscillator.stop();
        }, 700);
      } catch (e) {
        console.log("Audio not supported");
      }
    }

    // ── Check for due alerts every 30s ──
    function checkAlerts() {
      var now = new Date();
      var hours = String(now.getHours()).padStart(2, "0");
      var minutes = String(now.getMinutes()).padStart(2, "0");
      var currentTime = hours + ":" + minutes;
      var today = now.toDateString();

      for (var i = 0; i < alerts.length; i++) {
        var key = today + "-" + alerts[i].time + "-" + alerts[i].message;

        if (alerts[i].time === currentTime && !triggeredAlerts[key]) {
          triggeredAlerts[key] = true;
          playSound();
          alert("Alert: " + alerts[i].message);
        }
      }
    }

    setInterval(checkAlerts, 30000);
  </script>

</body>
</html>
