<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - MyPlant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            margin: auto;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header i {
            font-size: 3rem;
            color: #2e7d32;
        }

        .auth-header h2 {
            color: #2e7d32;
            font-weight: bold;
            margin-top: 1rem;
        }

        .form-control:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
        }

        .btn-success {
            background-color: #2e7d32;
            border-color: #2e7d32;
            padding: 0.75rem;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            background-color: #1b5e20;
            border-color: #1b5e20;
            transform: translateY(-2px);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Navbar adjustments for standalone page */
        .navbar-brand {
            font-size: 1.5rem;
        }
    </style>
</head>

<body>

    <!-- Simple Navbar to go back home -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="index.html"> MyPlant <i
                    class="bi bi-leaf-fill text-success"></i></a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item ms-3">
                        <span class="nav-link" data-lang-toggle style="cursor: pointer;">
                            <i class="bi bi-globe"></i> AR | EN
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-grow-1">
        <div class="auth-container">
            <div class="auth-header">
                <i class="bi bi-person-circle"></i>
                <h2 data-translate="welcome-back">Welcome Back</h2>
                <p class="text-muted" data-translate="login-subtitle">Please login to your account</p>
            </div>

            <form>
                <div class="mb-3">
                    <label for="email" class="form-label" data-translate="email-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0" id="email"
                            data-translate="email-placeholder" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label" data-translate="password-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="password"
                            data-translate="password-placeholder" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label text-muted small" for="remember" data-translate="remember-me">Remember me</label>
                    </div>
                    <a href="#" class="text-secondary small text-decoration-none" data-translate="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-success" id="loginBtn" data-translate="login-btn">Login</button>

                <div class="auth-footer">
                    <p class="mb-0 text-muted"><span data-translate="no-account">Don't have an account?</span> <a href="signup.html" data-translate="signup-link">Sign up</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Translations + Language Switcher -->
    <script src="translations.js"></script>
    <script src="language.js"></script>

    <script>
        document.querySelector('form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerText = "Logging in...";

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Login successful!");
                    const role = data.user?.role || 'user';
                    if (role === 'admin') {
                        window.location.href = 'AdminFeedback.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alert(data.message || "Login failed");
                    btn.disabled = false;
                    btn.innerText = "Login";
                }
            } catch (error) {
                console.error('Error:', error);
                alert("An error occurred. Please try again.");
                btn.disabled = false;
                btn.innerText = "Login";
            }
        });
    </script>

</body>

</html>
