      border-radius: 8px;

      color: #5a5a5a;

      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #639922;
      flex-shrink: 0;
    }

    .status-dot.loading {
      background: #BA7517;
      animation: pulse 1s infinite;
    }

    .status-dot.error {
      background: #E24B4A;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }

      margin-bottom: 1rem;

    let activeFilter = 'all';
    let userLat = null;
    let userLng = null;

    function dist(lat1, lng1, lat2, lng2) {

      const R = 6371;

      const dLat =
        (lat2 - lat1) * Math.PI / 180;

      const dLng =
        (lng2 - lng1) * Math.PI / 180;

      const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);

      return R * 2 *
        Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function setFilter(f, btn) {

      activeFilter = f;

      document.querySelectorAll('.filter-btn')
        .forEach(b => b.classList.remove('active'));

      btn.classList.add('active');

      filterNurseries();
    }

    function filterNurseries() {

      const q =
        document.getElementById('searchInput')
        .value
        .trim()
        .toLowerCase();

      let list = nurseries.filter(n => {

        const matchFilter =
          activeFilter === 'all' ||
          n.city === activeFilter;

        const matchSearch =
          !q ||
          n.name.toLowerCase().includes(q) ||
          n.region.toLowerCase().includes(q) ||
          n.city.toLowerCase().includes(q) ||
          n.specialty.toLowerCase().includes(q);

        return matchFilter && matchSearch;
      });

      if (userLat !== null) {

        list = list.map(n => ({
          ...n,
          distance: dist(userLat, userLng, n.lat, n.lng)
        }));

        list.sort((a, b) => a.distance - b.distance);
      }

      renderCards(list);
    }

    function renderCards(list) {

      const grid =
        document.getElementById('resultsGrid');

      if (!list.length) {

        grid.innerHTML = `
          <div class="empty">
            <i class="ti ti-search"
               style="font-size:32px;
               display:block;
               margin-bottom:8px"></i>

            No matching results found
          </div>
        `;

        return;
      }

      grid.innerHTML = list.map((n, i) => {

        const hasDistance =
          n.distance !== undefined;

        const isNearest =
          hasDistance && i === 0;

        const distText =
          hasDistance
          ? (Math.round(n.distance * 10) / 10) + ' km'
          : '';

        const badgeClass =
          hasDistance && n.distance > 30
          ? 'far'
          : '';

        return `
          <div class="nursery-card ${isNearest ? 'nearest' : ''}">

            <div class="card-header">

              <div class="card-name">
                ${isNearest ? '🌿 ' : ''}
                ${n.name}
              </div>

              ${hasDistance
                ? `<span class="card-badge ${badgeClass}">
                     ${distText}
                   </span>`
                : `<span class="card-badge">
                     ${n.city}
                   </span>`
              }

            </div>

            <div class="card-meta">

              <span>
                <i class="ti ti-map-pin"
                  style="font-size:14px"></i>

                ${n.region}, ${n.city}
              </span>

              <span>
                <i class="ti ti-clock"
                  style="font-size:14px"></i>

                ${n.hours}
              </span>

              <span>
                <i class="ti ti-leaf"
                  style="font-size:14px"></i>

                ${n.specialty}
              </span>

              <span>
                <i class="ti ti-phone"
                  style="font-size:14px"></i>

                ${n.phone}
              </span>

            </div>

            <div class="card-actions">

              <a href="${n.maps}"
                 target="_blank"
                 class="primary">

                <i class="ti ti-map"></i>
                Map
              </a>

              <a href="tel:${n.phone}">
                <i class="ti ti-phone"></i>
                Call
              </a>

              <a href="https://wa.me/962${n.phone.substring(1)}"
                 target="_blank">

                <i class="ti ti-brand-whatsapp"></i>
                WhatsApp
              </a>

            </div>

          </div>
        `;
      }).join('');
    }

    function findNearest() {

      const dot =
        document.getElementById('statusDot');

      const txt =
        document.getElementById('statusText');

      dot.className = 'status-dot loading';

      txt.textContent = 'Locating your position...';

      if (!navigator.geolocation) {

        dot.className = 'status-dot error';

        txt.textContent =
          'Your browser does not support geolocation.';

        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {

        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;

        const nearest = nurseries
          .map(n => ({
            ...n,
            distance: dist(
              userLat,
              userLng,
              n.lat,
              n.lng
            )
          }))

          .sort((a, b) => a.distance - b.distance)[0];

        dot.className = 'status-dot';

        txt.textContent =
          `Location detected — Nearest nursery: ${nearest.name}
           (${Math.round(nearest.distance * 10) / 10} km)`;

        filterNurseries();

      }, () => {

        dot.className = 'status-dot error';

        txt.textContent =
          'Unable to detect your location. Please allow location access.';
      });
    }

    renderCards(nurseries);

  </script>
